<!DOCTYPE html>
<html>
<head></head>
      
	<style>
		* 
		{
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1e1e2f, #2a1e3f);
			font-family: 'Segoe UI', Arial, sans-serif;
			padding: 20px;
		}

		#wrapper {
			display: grid;
			grid-template-columns: repeat(3, 100px);
			grid-template-rows: repeat(3, 100px);
			gap: 8px;
			background: #0f0f1a;
			padding: 16px;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			position: relative;
		}

		#winnerwrapper {
			grid-column: 1 / -1;
			text-align: center;
			color: #ffd166;
			font-size: 1.2rem;
			font-weight: bold;
			margin: 0 0 4px 0;
			letter-spacing: 0.5px;
			text-transform: uppercase;
		}

		#wrapper button.all {
			width: 100px;
			height: 100px;
			font-size: 2.8rem;
			font-weight: bold;
			background: #2b2b3d;
			color: #fff;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
		}

		#wrapper button.all:hover:not(:disabled) {
			background: #3d3d55;
			transform: scale(1.04);
			box-shadow: 0 4px 12px rgba(255, 255, 255, 0.08);
		}

		#wrapper button.all:active:not(:disabled) {
			transform: scale(0.96);
		}

		#wrapper button.all:disabled {
			cursor: not-allowed;
			opacity: 0.9;
		}

		#wrapper button.reset {
			grid-column: 1 / -1;
			margin-top: 8px;
			padding: 10px;
			background: #ef476f;
			color: #fff;
			border: none;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			transition: background 0.2s ease, transform 0.1s ease;
		}

		#wrapper button.reset:hover {
			background: #ff5c82;
			transform: scale(1.02);
		}

		#wrapper button.reset:active {
			transform: scale(0.98);
		}

		#wrapper p {
			grid-column: 1 / -1;
			display: inline-flex;
			justify-content: space-between;
			color: #cfcfe8;
			margin: 2px 0;
			font-size: 0.95rem;
		}

		br {
			display: none;
		}
	</style>
<body onload="setvalues()">
	
	<div id="wrapper">
		<p id="winnerwrapper"></p>
		<button class="all" onclick="fun(0)"></button>
		<button class="all" onclick="fun(1)"></button>
		<button class="all" onclick="fun(2)"></button>
		<button class="all" onclick="fun(3)"></button>
		<button class="all" onclick="fun(4)"></button>
		<button class="all" onclick="fun(5)"></button>
		<br>
		<button class="all" onclick="fun(6)"></button>
		<button class="all" onclick="fun(7)"></button>
		<button class="all" onclick="fun(8)"></button>
		<br>
		<button class="reset" onclick="resetgame()">Reset</button>

		<p> x won <p id="a"></p></p>
		<p> 0 won <p id="b"></p></p>
		<p> draw <p id="c"></p></p>
	</div>
</body>
</html>
<script>
	temp='0';
	draw='0';
	xwon='0'	;
	owon='0';
    hits='0';
    document.getElementById("winnerwrapper").innerText='player 1turn'
    
	function fun(i)
	{
		arr=document.getElementsByClassName('all');
		if(temp=='0')
		{	
		
			arr[i].innerText='x';
			temp='1';
			document.getElementById("winnerwrapper").innerText='player 2turn'
		}
		else
		{
			arr[i].innerText='0'
			temp='0'
			document.getElementById("winnerwrapper").innerText='player 1 turn'
		}
		arr[i].disabled=true;
		hits++;
		if(

			 (arr[0].innerText=='x'&& arr[1].innerText=='x'&& arr[2].innerText=='x')
			     ||
			     (arr[3].innerText=='x'&& arr[4].innerText=='x'&& arr[5].innerText=='x')
			     ||
			     (arr[6].innerText=='x'&& arr[7].innerText=='x' && arr[8].innerText=='x')
			     ||
		         (arr[0].innerText=='x'&& arr[4].innerText=='x'&& arr[8].innerText=='x')
                 ||
                 (arr[2].innerText=='x'&& arr[4].innerText=='x' && arr[6].innerText=='x')
                 ||
                 (arr[0].innerText=='x'&& arr[3].innerText=='x' && arr[6].innerText=='x')
                 ||
                 (arr[1].innerText=='x'&& arr[4].innerText=='x' && arr[7].innerText=='x')
                 ||
                 (arr[2].innerText=='x'&& arr[5].innerText=='x' && arr[8].innerText=='x')

                )
            
           
		{
			document.getElementById('winnerwrapper').innerText='x won';
			xwon++;
			// alert("x won")
			disableall()
		}
		 else if(
			     (arr[0].innerText=='0'&& arr[1].innerText=='0'&& arr[2].innerText=='0')
			     ||
			     (arr[3].innerText=='0'&& arr[4].innerText=='0'&& arr[5].innerText=='0')
			     ||
			     (arr[6].innerText=='0'&& arr[7].innerText=='0' && arr[8].innerText=='0')
			     ||
		         (arr[0].innerText=='0'&& arr[4].innerText=='0'&& arr[8].innerText=='0')
                 ||
                 (arr[2].innerText=='0'&& arr[4].innerText=='0' && arr[6].innerText=='0')
                 ||
                 (arr[0].innerText=='0'&& arr[3].innerText=='0' && arr[6].innerText=='0')
                 ||
                 (arr[1].innerText=='0'&& arr[4].innerText=='0' && arr[7].innerText=='0')
                 ||
                 (arr[2].innerText=='0'&& arr[5].innerText=='0' && arr[8].innerText=='0')

                )
		{
			document.getElementById('winnerwrapper').innerText='o won';
			owon++;
            // alert("0 won")
            disableall();
 		}
		else if(hits==9)
		{
			document.getElementById("winnerwrapper").innerText='draw'
			draw++;
			document.getElementById('c').innerText='draw'
		}
		setvalues()
} 
			
	function resetgame()
	{
		for( i = 0 ;i < 9 ; i++){
			arr[i].disabled = false;
			arr[i].innerText = " ";
		}
		temp = "0";
         hits="0";
        


         document.getElementById("winnerwrapper").innerText=' '



	}

	function disableall()
	{
		arr=document.getElementsByClassName("all");
		for(i=0;i<9;i++)
		{
			arr[i].disabled=true;
		}

	}


	function setvalues()
	{
		document.getElementById("a").innerText=xwon;
		document.getElementById("b").innerText=owon;
		document.getElementById("c").innerText=draw;
		



	}
	
</script>
