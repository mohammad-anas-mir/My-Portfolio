<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #10203F;
    --navy-soft: #1B3157;
    --paper: #F6F3EC;
    --gold: #C7972A;
    --gold-soft: #E7C878;
    --teal: #2F6B63;
    --ink: #1A1A1A;
    --muted: #6B7280;
    --line: #D9D3C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(199,151,42,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(47,107,99,0.18), transparent 45%);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .receipt {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
  }

  .receipt::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--gold), var(--teal));
  }

  .header {
    padding: 32px 32px 20px;
    border-bottom: 1px dashed var(--line);
  }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--navy);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .body {
    padding: 28px 32px 8px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy-soft);
    margin-bottom: 6px;
  }

  .field .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 0 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-wrap:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(199,151,42,0.18);
  }

  .input-wrap .prefix {
    color: var(--muted);
    font-size: 14px;
    padding-right: 8px;
    border-right: 1px solid var(--line);
    margin-right: 10px;
  }

  .input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    padding: 12px 0;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  .input-wrap input::placeholder {
    color: #B7B2A4;
    font-weight: 400;
  }

  /* read-only / computed fields look like printed receipt lines */
  .field.computed .input-wrap {
    background: #FBF9F4;
    border-style: dashed;
  }

  .field.computed input {
    color: var(--navy);
    font-weight: 600;
  }

  .field.computed input:read-only {
    cursor: default;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 8px 0 24px;
  }

  .total-row {
    margin: 0 32px 0;
    padding: 20px 0 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1.5px solid var(--navy);
  }

  .total-row .label {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--navy);
    font-weight: 600;
  }

  .total-row .input-wrap {
    background: var(--navy);
    border-color: var(--navy);
    max-width: 160px;
  }

  .total-row .input-wrap .prefix {
    color: var(--gold-soft);
    border-right-color: rgba(255,255,255,0.25);
  }

  .total-row .input-wrap input {
    color: #fff;
    font-family: 'Fraunces', serif;
    font-size: 19px;
    text-align: right;
    font-weight: 600;
  }

  .footer-note {
    text-align: center;
    padding: 0 32px 26px;
    color: var(--muted);
    font-size: 12px;
  }

  .two-col {
    display: flex;
    gap: 14px;
  }

  .two-col .field {
    flex: 1;
  }
</style>
</head>
<body>

  <div class="receipt">
    <div class="header">
      <h1>GST Calculator</h1>
      <p>Enter details to work out the final payable amount</p>
    </div>

    <div class="body">

      <div class="two-col">
        <div class="field">
          <label for="price">Price <span class="hint">(per unit)</span></label>
          <div class="input-wrap">
            <span class="prefix">₹</span>
            <input type="number" id="price" name="price" placeholder="0.00" min="0" step="0.01" onkeyup="fun()">
          </div>
        </div>

        <div class="field">
          <label for="quantity">Quantity</label>
          <div class="input-wrap">
            <span class="prefix">×</span>
            <input type="number" id="quantity" name="quantity" placeholder="1" min="0" step="1" onkeyup="fun()">
          </div>
        </div>
      </div>

      <div class="field computed">
        <label for="subtotal">Subtotal</label>
        <div class="input-wrap">
          <span class="prefix">₹</span>
          <input type="number" id="subtotal" name="subtotal" placeholder="0.00" readonly onkeyup="fun()">
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="discountPercentage">Discount</label>
          <div class="input-wrap">
            <input type="number" id="discountPercentage" name="discountPercentage" placeholder="0" min="0" max="100" step="0.1" onkeyup="fun()">
            <span class="prefix" style="border-right:none;margin-right:0;padding-right:0;">%</span>
          </div>
        </div>

        <div class="field computed">
          <label for="discountAmount">Discount Amt</label>
          <div class="input-wrap">
            <span class="prefix">₹</span>
            <input type="number" id="discountAmount" name="discountAmount" placeholder="0.00" readonly onkeyup="fun()">
          </div>
        </div>
      </div>

    </div>

    <div class="total-row">
      <span class="label">Total Amount Paid</span>
      <div class="input-wrap">
        <span class="prefix">₹</span>
        <input type="number" id="totalAmountPaid" name="totalAmountPaid" placeholder="0.00" readonly onkeyup="fun()">
      </div>
    </div>

    <p class="footer-note">Inclusive of applicable GST</p>
  </div>

</body>
</html>
<script>
  function fun()
  {
    p=document.getElementById('price').value;
    q=document.getElementById('quantity').value;
    st=p*q;
    document.getElementById('subtotal').value=st;
    disper=document.getElementById('discountPercentage').value;
    da=(st/100)*disper;
    document.getElementById('discountAmount').value=da;
    ta=st-da;
    document.getElementById('totalAmountPaid').value=ta;

  }
</script>
