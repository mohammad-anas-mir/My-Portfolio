<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<h1> CALCULATOR </h1>
	<div id="wrapper">
		<input id="result" type="text" name="" placeholder="0">

		<br>

		<button class="all" onclick="fun(1)">1</button>
		<button class="all" onclick="fun(2)">2</button>
		<button class="all" onclick="fun(3)">3</button>

		<br>

		<button class="all" onclick="fun(4)">4</button>
		<button class="all" onclick="fun(5)">5</button>
		<button class="all" onclick="fun(6)">6</button>

		<br>

		<button class="all" onclick="fun(7)">7</button>
		<button class="all" onclick="fun(8)">8</button>
		<button class="all" onclick="fun(9)">9</button>

		<br>

		<button class="all" onclick="fun('+')">+</button>
		<button class="all" onclick="fun('-')">-</button>
		<button class="all" onclick="fun('/')">/</button>

		<br>

		<button class="all" onclick="fun('*')">*</button>
		<button class="all" onclick="fun(0)">0</button>
		<button class="all" onclick="showresult()">=</button>

		<br>

		<button class="all" onclick="percentage()">%</button>
		<button class="all" onclick="allclear()">AC</button>
		<button class="all" onclick="backspace()"><==</button>
		
	</div>

</body>
</html>

<script>
	function fun(i)
	{
		document.getElementById('result').value+=i
	}


	function showresult()
	{
		p=document.getElementById('result').value
		r=eval(p)
		document.getElementById('result').value=r;
	}

	function allclear()
	{
		document.getElementById("result").value=' ';
	}

	function backspace()
	{
		str=document.getElementById('result').value;
		str=str.substring(0,str.length-1)
		document.getElementById('result').value=str;

	}

    function percentage()
{
    document.getElementById('result').value =
    document.getElementById('result').value / 100;
}
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    h1 {
        position: absolute;
        top: 40px;
        color: white;
        font-size: 32px;
        letter-spacing: 2px;
    }

    #wrapper {
        width: 320px;
        padding: 25px;
        background: #1e1e2f;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        text-align: center;
        margin-top: 80px;
        margin-bottom: 30px;
        
    }

    #result {
        width: 100%;
        height: 65px;
        margin-bottom: 20px;
        padding: 10px 15px;
        border: none;
        outline: none;
        border-radius: 12px;
        background: #f5f5f5;
        color: #222;
        font-size: 28px;
        text-align: right;
    }

    .all {
        width: 60px;
        height: 55px;
        margin: 5px;
        border: none;
        border-radius: 12px;
        background: #33334d;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .all:hover {
        background: #4b4b70;
        transform: scale(1.05);
    }

    .all:active {
        transform: scale(0.95);
    }

    /* Operator buttons */
    button[onclick="fun('+')"],
    button[onclick="fun('-')"],
    button[onclick="fun('/')"],
    button[onclick="fun('*')"] {
        background: #ff9500;
    }

    button[onclick="fun('+')"]:hover,
    button[onclick="fun('-')"]:hover,
    button[onclick="fun('/')"]:hover,
    button[onclick="fun('*')"]:hover {
        background: #ffad33;
    }

    /* Equal button */
    button[onclick="showresult()"] {
        background: #28a745;
    }

    button[onclick="showresult()"]:hover {
        background: #34c759;
    }

    /* AC button */
    button[onclick="allclear()"] {
        background: #e63946;
    }

    button[onclick="allclear()"]:hover {
        background: #ff4d5a;
    }

    /* Percentage button */
    button[onclick="percentage()"] {
        background: #0077b6;
    }

    button[onclick="percentage()"]:hover {
        background: #0096c7;
    }

    /* Backspace button */
    button[onclick="backspace()"] {
        background: #6c757d;
    }

    button[onclick="backspace()"]:hover {
        background: #868e96;
    }


</style>
