<!DOCTYPE html>
<html>
<head>
	
	<title>Quote of the Day</title>
</head>
<body onload="genquote()">

	<div id="wrapper">
		<h1> quote of the day </h1>
		<p id="data"></p>

		<hr>

		<button onclick="genquote()">Generate New Quote</button>

		 <hr>

		 <button onclick="prequote()">PREVIOUS</button>

		 <button onclick="nxtquote()">NEXT</button>

		<br>
		<br>

	</div>	

</body>
</html> 

<script type="text/javascript">
		arr=[ 'I Like Coding',
			  'My Name Is Anas ',
			  'Studying at Code Today',
			  'Ok Byee'];

	function genquote()
	{
		x=Math.random();


		x=x*arr.length;

		x=Math.floor(x);

		document.getElementById("data").innerText=arr[x];
	}


	function prequote()
	{
		x=x-1;
		if(x<0)
		{
			x=arr.length-1;
		}

		 genquote()
    }

    function nxtquote()
	{
		x=x+1;

		if(x>arr.length+1)
		{
			x=0

		}
		genquote()
   
    }



	
</script>
<style>
	
	*
	{
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	body
	{
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: radial-gradient(circle at top, #2b2b2b, #0a0a0a);
		font-family: 'Segoe UI', Arial, sans-serif;
	}

	#wrapper
	{
		background-color: #1e1e1e;
		border: 1px solid #333;
		border-radius: 14px;
		padding: 40px 50px;
		width: 90%;
		max-width: 500px;
		text-align: center;
		box-shadow: 0 10px 30px rgba(0,0,0,0.5);
	}

	h1
	{
		color: #f5a623;
		text-transform: uppercase;
		letter-spacing: 1px;
		font-size: 22px;
		margin-bottom: 25px;
	}

	hr
	{
		border: none;
		border-top: 1px solid #333;
		margin: 25px 0;
	}

	#data
	{
		color: #ffffff;
		text-align: center;
		font-size: 26px;
		font-weight: 600;
		min-height: 60px;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	button
	{
		padding: 12px 20px;
		margin: 6px;
		border: none;
		border-radius: 8px;
		background-color: #f5a623;
		color: #1e1e1e;
		font-weight: 700;
		font-size: 14px;
		cursor: pointer;
		transition: background-color 0.2s ease, transform 0.1s ease;
	}

	button:hover
	{
		background-color: #ffbb45;
	}

	button:active
	{
		transform: scale(0.96);
	}
</style>
